name: Publish to PyPI


on:
  release:
    types: [published]
  workflow_dispatch: # allows a manual re-run/dry-run from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag v$TAG does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/publish-check
          /tmp/publish-check/bin/pip install dist/*.whl
          /tmp/publish-check/bin/agenci version
          mkdir /tmp/publish-check-project && cd /tmp/publish-check-project
          /tmp/publish-check/bin/agenci init
          /tmp/publish-check/bin/agenci test

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/agenci
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
