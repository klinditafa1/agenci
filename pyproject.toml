[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenci"
version = "0.2.0"
description = "CI/CD, evaluation, and security testing for AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Agenci contributors" }]
keywords = ["ai", "agents", "llm", "ci", "testing", "evaluation", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dashboard = ["fastapi>=0.111", "uvicorn>=0.30"]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
mcp = ["mcp>=1.0,<2.0"]
autogen = ["autogen-agentchat>=0.4", "autogen-core>=0.4", "autogen-ext>=0.4"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "respx>=0.21",
]
all = ["agenci[openai,dashboard,langchain,crewai,mcp,autogen,otel,dev]"]

[project.urls]
Homepage = "https://github.com/agenci-dev/agenci"
Documentation = "https://github.com/agenci-dev/agenci/tree/main/docs"
Issues = "https://github.com/agenci-dev/agenci/issues"

[project.scripts]
agenci = "agenci.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["agenci"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"agenci/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = "*Tests"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.pyright]
include = ["agenci"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
